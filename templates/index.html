<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial News Analysis</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/animations.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/layout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/widgets.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/controls.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/buttons.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/tables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/badges.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/responsive.css') }}">
</head>
<body>
    <div class="background-gradient"></div>
    
    <div class="top-bar-grid">
        <div class="widget">
            <h2>This Month's Summary</h2>
            <div class="summary-values">
                <p class="summary-value positive-text number-counter" id="monthly-positive">...</p>
                <p class="summary-value negative-text number-counter" id="monthly-negative">...</p>
            </div>
            <p class="total-text" id="monthly-total">Total: ...</p>
        </div>
        
        <div class="widget">
            <h2 id="daily-summary-title">Daily Summary</h2>
            <div class="summary-values">
                <p class="summary-value positive-text number-counter" id="daily-positive">...</p>
                <p class="summary-value negative-text number-counter" id="daily-negative">...</p>
                <p class="summary-value neutral-text number-counter" id="daily-neutral">...</p>
            </div>
        </div>
        
        <div class="widget controls">
            <div class="confidence-slider-container">
                <label for="confidence-slider">AI Confidence Threshold</label>
                <div class="slider-wrapper">
                    <input type="range" id="confidence-slider" min="0" max="100" value="0">
                    <div class="slider-track"></div>
                    <div class="slider-fill"></div>
                </div>
                <div class="confidence-input-wrapper">
                    <input type="number" id="confidence-input" min="0" max="100" value="0">
                    <span class="input-suffix">%</span>
                </div>
            </div>
            
            <div class="date-nav">
                <button id="btn-prev" title="Previous Day">
                    <span>&lt;</span>
                </button>
                <h1 id="date-title">...</h1>
                <button id="btn-next" title="Next Day">
                    <span>&gt;</span>
                </button>
            </div>
            
            <div class="clock-container">
                <span id="clock"></span>
            </div>
        </div>
    </div>
    
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Brief</th>
                    <th>Subject Company</th>
                    <th>Sentiment</th>
                    <th>Confidence</th>
                    <th>Published At</th>
                </tr>
            </thead>
            <tbody id="articles-tbody"></tbody>
        </table>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
